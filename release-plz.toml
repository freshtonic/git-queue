# release-plz configuration — https://release-plz.dev/docs/config
#
# The release PR is opened against whichever branch the workflow runs on
# (`release`; see .github/workflows/release-plz.yml). Versions are bumped from
# Conventional Commits (feat → minor, fix → patch, `!`/BREAKING → major while
# < 1.0 stays a minor bump).

[workspace]
# Bump the version and regenerate CHANGELOG.md from the commit history.
changelog_update = true
# release-plz creates and pushes the `v<version>` tag, which triggers dist's
# release workflow (.github/workflows/release.yml, generated by `dist init`).
git_tag_enable = true
# dist owns the GitHub Release — it attaches the prebuilt binaries and the
# curl|sh / irm|iex installers and pulls the notes from CHANGELOG.md — so
# release-plz must NOT also create one (only one tool can own the release).
git_release_enable = false

[[package]]
name = "git-queue"
# Publish this crate to crates.io on release.
publish = true
