name: Release-plz

# Runs on every push to the `release` branch (i.e. every merge into it).
#
# Flow (release-plz's standard release-PR model):
#   1. Promote work onto `release` (e.g. merge `main` → `release`). This run
#      opens/updates a "chore: release" PR that bumps the version in Cargo.toml
#      and updates CHANGELOG.md from the Conventional-Commit history.
#   2. Merge that release PR. This run sees the new version and publishes the
#      crate to crates.io (via trusted publishing / OIDC — no stored token) and
#      pushes a `v<version>` tag, which triggers dist to build the binaries and
#      cut the GitHub release.
#
# Publishing uses crates.io **Trusted Publishing** (OIDC): the crate's trusted
# publisher on crates.io must be configured for this repo + `release-plz.yml`.
# No `CARGO_REGISTRY_TOKEN` secret is needed.
#
# Optional secret:
#   RELEASE_PLZ_TOKEN — a fine-grained PAT / GitHub App token so the release PR
#                       triggers other workflows (PRs opened with the default
#                       GITHUB_TOKEN don't). Falls back to GITHUB_TOKEN.

on:
  push:
    branches:
      - release

permissions: {} # granted per-job (least privilege)

jobs:
  # Publish to crates.io + tag + GitHub release when a version is unpublished
  # (i.e. right after the release PR is merged).
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the version tag
      id-token: write # OIDC for crates.io trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Authenticate to crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Open/update the version-bump + changelog release PR.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Serialise PR updates so concurrent pushes don't race the release PR.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
